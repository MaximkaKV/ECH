<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a56db">
  <title>🏭 Адаптация на заводе</title>
  <style>
    :root { --primary: #1a56db; --bg: #f5f7fa; --card: #fff; --text: #1f2937; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 80px; }
    header { background: var(--primary); color: #fff; padding: 16px; text-align: center; position: sticky; top: 0; }
    h1 { font-size: 1.25rem; }
    .search { margin: 12px 16px; }
    .search input { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 12px; font-size: 1rem; }
    .tabs { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px; background: #fff; }
    .tab { padding: 8px 12px; background: #e5e7eb; border-radius: 20px; font-size: 0.9rem; white-space: nowrap; cursor: pointer; flex-shrink: 0; }
    .tab.active { background: var(--primary); color: #fff; }
    main { padding: 16px; }
    .card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
    .card h3 { margin-bottom: 8px; color: var(--primary); }
    .info { margin: 6px 0; font-size: 0.95rem; line-height: 1.5; }
    .info b { color: #374151; }
    .hint { background: #dbeafe; padding: 12px; margin: 12px 16px; border-radius: 8px; font-size: 0.9rem; text-align: center; }
  </style>
</head>
<body>
  <header><h1>👋 Добро пожаловать на завод</h1></header>
  <div class="hint">📲 Чтобы добавить на главный экран: меню браузера → "Добавить на главный экран"</div>
  <div class="search"><input type="text" id="search" placeholder="🔍 Поиск: столовая, медпункт..."></div>
  <nav class="tabs" id="tabs"></nav>
  <main id="content"></main>

  <script>
    const DATA = [
      { id: "food", title: "🍽 Столовые", items: [
        { label: "Адрес", value: "Корпус А, 1 этаж / Корпус В, цоколь" },
        { label: "Часы", value: "07:00–19:00 (обед 12:00–14:00)" },
        { label: "Примечание", value: "Обед по талонам. Вегетарианское меню — по запросу за 2 дня." }
      ]},
      { id: "med", title: "🏥 Медпункт", items: [
        { label: "Адрес", value: "Административный корпус, 2 этаж, каб. 204" },
        { label: "Часы", value: "08:00–17:00 (Пн–Пт)" },
        { label: "Примечание", value: "При травмах/ожогах — 112 или внутренний 200. Аптечка в каждом цеху." }
      ]},
      { id: "uniform", title: "👔 Спецодежда и СИЗ", items: [
        { label: "Адрес", value: "Склад №3, рядом с проходной" },
        { label: "Часы", value: "09:00–16:00" },
        { label: "Примечание", value: "Возьмите паспорт и направление от мастера. Размер подбирается на месте." }
      ]},
      { id: "hr", title: "📋 Оформление и документы", items: [
        { label: "Адрес", value: "Отдел кадров, каб. 110" },
        { label: "Часы", value: "09:00–18:00" },
        { label: "Примечание", value: "Паспорт, СНИЛС, ИНН, трудовую. Пропуск оформляется в день прихода." }
      ]},
      { id: "emergency", title: "🆘 Экстренные контакты", items: [
        { label: "Служба безопасности", value: "вн. 100" },
        { label: "Мастер смены", value: "вн. 105" },
        { label: "Пожарная / Скорая", value: "101 / 112" },
        { label: "HR-координатор", value: "вн. 150" }
      ]}
    ];

    let activeTab = 0;
    const render = () => {
      document.getElementById('tabs').innerHTML = DATA.map((d, i) => 
        `<div class="tab ${i === activeTab ? 'active' : ''}" onclick="activeTab=${i};render()">${d.title}</div>`
      ).join('');
      const q = document.getElementById('search').value.toLowerCase();
      const tab = DATA[activeTab];
      const filtered = tab.items.filter(it => it.label.toLowerCase().includes(q) || it.value.toLowerCase().includes(q));
      document.getElementById('content').innerHTML = filtered.length === 0 
        ? '<div style="text-align:center;color:#6b7280;padding:40px 0;">Ничего не найдено</div>'
        : `<div class="card"><h3>${tab.title}</h3>${filtered.map(it => 
            `<div class="info"><b>${it.label}:</b> ${it.value}</div>`
          ).join('')}</div>`;
    };
    document.getElementById('search').oninput = render;
    render();
  </script>
</body>
</html>
